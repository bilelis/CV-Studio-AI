version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cv_matcher_backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - CHAT_MODEL=qwen2.5:7b
      - EMBED_MODEL=bge-m3
      - DATA_DIR=/app/data
      - FRONTEND_ORIGIN=http://localhost:5173
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
